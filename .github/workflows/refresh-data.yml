name: Refresh job-market data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - run: pytest -q
      # DuckDB is intentionally not committed by default. Add an artifact,
      # object-storage upload, or database deployment step for your hosting target.

